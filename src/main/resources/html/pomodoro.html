<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro</title>
    <link rel="icon" href="/icon" type="image/svg+xml">
    <link rel="stylesheet" href="/static/v0/css/theme.css">
    <link rel="stylesheet" href="/static/v0/css/shared.css">
    <link rel="stylesheet" href="/static/v0/css/pomodoro.css">
    <script src="/static/v0/js/theme.js"></script>
</head>
<body>
    <button class="theme-toggle" type="button" aria-label="Toggle theme">
        <span class="tt-sun">☀</span><span class="tt-moon">☾</span>
    </button>

    <div class="container">
        <a href="/" class="back-link">Back</a>

        <header class="header">
            <h1 class="header-title">Pomodoro</h1>
            <p class="header-sub">// focus timer</p>
        </header>

        <main class="pomodoro-shell" aria-live="polite">
            <div class="mode-tabs" role="tablist" aria-label="Timer mode">
                <button class="mode-tab active" type="button" data-mode="focus">Focus</button>
                <button class="mode-tab" type="button" data-mode="short">Short</button>
                <button class="mode-tab" type="button" data-mode="long">Long</button>
            </div>

            <section class="timer-panel">
                <div class="timer-ring" id="timer-ring">
                    <svg class="ring-svg" viewBox="0 0 220 220" aria-hidden="true">
                        <circle class="ring-track" cx="110" cy="110" r="96"></circle>
                        <circle class="ring-progress" id="ring-progress" cx="110" cy="110" r="96"></circle>
                    </svg>
                    <div class="timer-face">
                        <div class="mode-label" id="mode-label">Focus</div>
                        <div class="time-display" id="time-display">25:00</div>
                        <div class="session-line" id="session-line">0 sessions</div>
                    </div>
                </div>

                <div class="controls" aria-label="Timer controls">
                    <button class="icon-btn" type="button" id="reset-btn" aria-label="Reset timer" title="Reset">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v6h6"/></svg>
                    </button>
                    <button class="primary-btn" type="button" id="start-btn">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="8 5 19 12 8 19 8 5"/></svg>
                        <span>Start</span>
                    </button>
                    <button class="icon-btn" type="button" id="skip-btn" aria-label="Skip session" title="Skip">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
                    </button>
                </div>
            </section>

            <section class="settings-panel" aria-label="Timer settings">
                <label class="setting-field">
                    <span>Focus</span>
                    <input type="number" id="focus-minutes" min="1" max="180" value="25">
                </label>
                <label class="setting-field">
                    <span>Short</span>
                    <input type="number" id="short-minutes" min="1" max="60" value="5">
                </label>
                <label class="setting-field">
                    <span>Long</span>
                    <input type="number" id="long-minutes" min="1" max="90" value="15">
                </label>
                <label class="setting-field">
                    <span>Round</span>
                    <input type="number" id="round-size" min="1" max="12" value="4">
                </label>
            </section>
        </main>

        <div class="status-line" id="status-line">ready</div>
        <div class="footer">serbekun service // pomodoro</div>
    </div>

    <script src="/static/v0/js/pomodoro.js"></script>
</body>
</html>
